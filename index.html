<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>Lista de compras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f7f4;--card:#fff;--tx:#14201a;--tx2:#5a6b61;--ac:#15803d;--ac2:#dcfce7;--bd:#d5ded8;--rojo:#dc2626;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231d;--tx:#e8f0ea;--tx2:#9db0a3;--ac:#22c55e;--ac2:#14532d;--bd:#2b3b32;--rojo:#f87171;--warn:#fbbf24;--warnbg:#3b2e0a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 16px calc(24px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px;padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:1.25rem;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.ico{background:none;border:0;font-size:1.5rem;min-width:44px;min-height:44px;border-radius:12px}
.ico:active{background:var(--ac2)}
.lugares{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.lugares::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:10px 16px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);min-height:44px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
#mic{width:112px;height:112px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:2.8rem;box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;transition:transform .08s}
#mic:active{transform:scale(.96)}
#mic.rec{background:var(--rojo)}
#mic .nivel{position:absolute;inset:-6px;border-radius:50%;border:4px solid currentColor;opacity:.35;transform:scale(1);pointer-events:none}
#estado{color:var(--tx2);min-height:1.4em;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0}
.card h2{font-size:1rem;margin:0 0 8px;color:var(--tx2);font-weight:600}
.entendi{font-style:italic;color:var(--tx2);margin:0 0 10px}
.ficha{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.ficha:first-of-type{border-top:0}
.ficha input.n{flex:1 1 140px;min-width:0}
.ficha input.c{width:64px}
.ficha select{max-width:110px}
input,select{font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--bd);border-radius:10px;padding:9px 10px;min-height:44px}
input:focus,select:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.x{background:none;border:0;color:var(--rojo);font-size:1.2rem;min-width:44px;min-height:44px;border-radius:10px}
.x:active{background:var(--warnbg)}
.fila{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:disabled{opacity:.5}
.manual{display:flex;gap:8px;margin:8px 0}
.manual input{flex:1;min-width:0}
.manual button{flex:0 0 auto;padding:0 18px}
.grupo{margin:14px 0 4px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.grupo span{font-weight:400;color:var(--tx2);font-size:.85rem}
.item{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 6px 6px 14px;margin:6px 0}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:600}
.item .m{display:block;color:var(--tx2);font-size:.8rem}
.item.local{border-style:dashed}
.vacio{color:var(--tx2);text-align:center;padding:20px 0}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.92rem}
.aviso button{margin-top:6px;border:1.5px solid currentColor;background:none;border-radius:10px;padding:8px 12px;font-weight:600}
.lista-h{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.lista-h h2{margin:0;font-size:1.05rem}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:#1f2937;color:#fff;border-radius:14px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:9}
#toast.on{display:flex}
#toast button{background:none;border:0;color:#86efac;font-weight:700;padding:8px}
.ajustes label{display:block;margin:12px 0 4px;font-weight:600}
.ajustes input,.ajustes select{width:100%}
.hide{display:none!important}
.hint{color:var(--tx2);font-size:.85rem;margin-top:4px}
@keyframes pulso{50%{opacity:.8}}
</style>
</head>
<body>

<!-- Pantalla principal -->
<main id="pPrincipal">
  <header>
    <h1>🛒 Lista de compras</h1>
    <button class="ico" id="bAjustes" aria-label="Ajustes">⚙️</button>
  </header>

  <div class="lugares" id="lugares"></div>

  <div class="mic-wrap">
    <button id="mic" aria-label="Grabar"><span class="nivel" id="nivel"></span>🎤</button>
    <div id="estado">Tocá el micrófono y decí lo que falta</div>
  </div>

  <div id="avisos"></div>

  <section id="propuesta" class="card hide">
    <h2>Esto es lo que entendí</h2>
    <p class="entendi" id="entendi"></p>
    <div id="fichas"></div>
    <div class="fila">
      <button class="btn" id="bDescartar">Descartar</button>
      <button class="btn pri" id="bGuardar">Guardar todo</button>
    </div>
  </section>

  <form class="manual" id="fManual">
    <input id="iManual" placeholder="Escribir algo a mano…" autocomplete="off" enterkeyhint="done">
    <button class="btn pri" type="submit">Sumar</button>
  </form>

  <div class="lista-h">
    <h2>Falta comprar</h2>
    <button class="ico" id="bRefrescar" aria-label="Refrescar">🔄</button>
  </div>
  <div id="lista"><div class="vacio">Cargando…</div></div>
</main>

<!-- Ajustes -->
<main id="pAjustes" class="hide ajustes">
  <header>
    <h1>⚙️ Ajustes</h1>
    <button class="ico" id="bVolver" aria-label="Volver">✕</button>
  </header>
  <label for="aUrl">Dirección del Apps Script</label>
  <input id="aUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
  <label for="aClave">Clave</label>
  <input id="aClave" type="password" autocomplete="off">
  <label for="aQuien">¿Quién sos?</label>
  <select id="aQuien"><option>Erick</option><option>Luciana</option><option value="otro">Otro…</option></select>
  <input id="aOtro" class="hide" placeholder="Tu nombre" style="margin-top:8px">
  <div class="fila"><button class="btn pri" id="bGuardarAj">Guardar</button></div>
  <p class="hint">Para configurar otro celular: abrí la app con un link que termine en <code>#u=…&amp;k=…&amp;q=…</code>.</p>
</main>

<div id="toast"><span id="toastTx"></span><button id="toastBt"></button></div>

<script>
'use strict';
// ---------- Constantes ----------
const LUGARES = ['Alacena', 'Heladera', 'Freezer', 'Limpieza', 'Baño', 'Otros'];
const MAX_SEG = 120;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Almacenamiento ----------
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin storage */ } }
let cfg = lsGet('cfg', { u: '', k: '', q: '' });
let lugar = lsGet('lugar', 'Alacena');
if (LUGARES.indexOf(lugar) < 0) lugar = 'Alacena';
let items = lsGet('items', []);          // cache de la lista
let cola = lsGet('cola', []);            // operaciones sin enviar
let propuesta = null;                    // {texto, items:[{producto,cantidad,lugar,nota}]}
let ocultos = new Set();                 // ids borrados con deshacer en curso

// ---------- Ajustes y link de configuración ----------
function leerHash() {
  if (!location.hash || location.hash.length < 2) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('u') || p.get('k') || p.get('q')) {
    if (p.get('u')) cfg.u = p.get('u');
    if (p.get('k')) cfg.k = p.get('k');
    if (p.get('q')) cfg.q = p.get('q');
    lsSet('cfg', cfg);
    history.replaceState(null, '', location.pathname + location.search);
  }
}
function abrirAjustes() {
  $('aUrl').value = cfg.u || '';
  $('aClave').value = cfg.k || '';
  const sel = $('aQuien');
  const conocido = cfg.q === 'Erick' || cfg.q === 'Luciana';
  sel.value = conocido || !cfg.q ? (cfg.q || 'Erick') : 'otro';
  $('aOtro').classList.toggle('hide', sel.value !== 'otro');
  $('aOtro').value = conocido ? '' : (cfg.q || '');
  $('pPrincipal').classList.add('hide');
  $('pAjustes').classList.remove('hide');
}
function cerrarAjustes() {
  $('pAjustes').classList.add('hide');
  $('pPrincipal').classList.remove('hide');
}
function guardarAjustes() {
  cfg.u = $('aUrl').value.trim();
  cfg.k = $('aClave').value.trim();
  const s = $('aQuien').value;
  cfg.q = s === 'otro' ? ($('aOtro').value.trim() || 'Otro') : s;
  lsSet('cfg', cfg);
  cerrarAjustes();
  refrescar();
}
function configurado() { return !!(cfg.u && cfg.k); }

// ---------- Red ----------
class ErrRed extends Error {}
async function apiGet(accion) {
  const url = cfg.u + (cfg.u.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(cfg.k) + '&accion=' + encodeURIComponent(accion);
  let r;
  try { r = await fetch(url); } catch (e) { throw new ErrRed('Sin conexión'); }
  return await leerResp(r);
}
async function apiPost(cuerpo) {
  let r;
  try {
    r = await fetch(cfg.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ k: cfg.k }, cuerpo)) });
  } catch (e) { throw new ErrRed('Sin conexión'); }
  return await leerResp(r);
}
async function leerResp(r) {
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Respuesta rara del servidor'); }
  if (!j.ok) throw new Error(j.error === 'clave' ? 'La clave no coincide (revisá Ajustes)' : (j.error || 'Error'));
  return j;
}

// ---------- Cola sin conexión ----------
function guardarCola() { lsSet('cola', cola); }
async function vaciarCola() {
  if (!configurado() || !cola.length) return;
  while (cola.length) {
    const op = cola[0];
    try { await apiPost(op); } catch (e) {
      if (e instanceof ErrRed) break;
      if (/clave/.test(e.message)) break;
    }
    cola.shift(); guardarCola();
  }
  pintarAvisos();
}

// ---------- Lista ----------
async function refrescar() {
  if (!configurado()) { pintarLista(); pintarAvisos(); return; }
  await vaciarCola();
  try {
    const j = await apiGet('lista');
    items = j.items || [];
    lsSet('items', items);
  } catch (e) {
    avisoTemp(e instanceof ErrRed ? 'Sin señal: muestro la última lista guardada.' : e.message);
  }
  pintarLista();
  pintarAvisos();
}
function fechaCorta(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const hoy = new Date();
  const mismo = d.toDateString() === hoy.toDateString();
  const hm = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  return mismo ? 'hoy ' + hm : d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}
function pintarLista() {
  const el = $('lista');
  const vis = items.filter((i) => !ocultos.has(i.id));
  if (!configurado()) { el.innerHTML = '<div class="vacio">Configurá la app en ⚙️ Ajustes.</div>'; return; }
  if (!vis.length) { el.innerHTML = '<div class="vacio">No falta nada. 🎉</div>'; return; }
  let h = '';
  LUGARES.concat(Array.from(new Set(vis.map((i) => i.lugar))).filter((l) => LUGARES.indexOf(l) < 0)).forEach((l) => {
    const g = vis.filter((i) => i.lugar === l);
    if (!g.length) return;
    h += '<div class="grupo">' + esc(l) + '<span>' + g.length + '</span></div>';
    g.forEach((i) => {
      const meta = [i.quien, fechaCorta(i.fecha)].filter(Boolean).join(' · ') + (i.local ? ' · sin enviar' : '') + (i.nota ? ' · ' + i.nota : '');
      h += '<div class="item' + (i.local ? ' local' : '') + '"><div class="t"><b>' + esc(i.producto) + '</b>' +
        (i.cantidad ? ' <span>× ' + esc(i.cantidad) + '</span>' : '') + '<span class="m">' + esc(meta) + '</span></div>' +
        '<button class="x" data-del="' + esc(i.id) + '" aria-label="Borrar">✕</button></div>';
    });
  });
  el.innerHTML = h;
}

// ---------- Borrar con deshacer ----------
function borrar(id) {
  ocultos.add(id);
  pintarLista();
  let deshecho = false;
  toast('Borrado', 'Deshacer', () => { deshecho = true; ocultos.delete(id); pintarLista(); }, 4000, async () => {
    if (deshecho) return;
    const it = items.find((x) => x.id === id);
    items = items.filter((x) => x.id !== id); lsSet('items', items);
    ocultos.delete(id);
    if (it && it.local) { cola = cola.filter((op) => !(op.accion === 'agregar' && op.items.some((x) => x._tmp === id))); guardarCola(); pintarLista(); return; }
    try { await apiPost({ accion: 'borrar', ids: [id] }); } catch (e) {
      if (e instanceof ErrRed) { cola.push({ accion: 'borrar', ids: [id] }); guardarCola(); pintarAvisos(); }
      else avisoTemp(e.message);
    }
    pintarLista();
  });
}

// ---------- Guardar ítems ----------
async function guardarItems(lista) {
  lista = lista.filter((i) => i.producto && i.producto.trim());
  if (!lista.length) return;
  if (!configurado()) { avisoTemp('Primero configurá la app en ⚙️ Ajustes.'); return; }
  try {
    const j = await apiPost({ accion: 'agregar', items: lista, quien: cfg.q });
    items = items.concat(j.items || []); lsSet('items', items);
    toast('Guardado: ' + lista.length + (lista.length === 1 ? ' producto' : ' productos'), '', null, 2500);
  } catch (e) {
    if (e instanceof ErrRed) {
      const ahora = new Date().toISOString();
      const conTmp = lista.map((i) => Object.assign({}, i, { _tmp: 'tmp' + Math.random().toString(36).slice(2, 9) }));
      cola.push({ accion: 'agregar', items: conTmp.map((i) => ({ producto: i.producto, cantidad: i.cantidad, lugar: i.lugar, nota: i.nota, _tmp: i._tmp })), quien: cfg.q });
      guardarCola();
      conTmp.forEach((i) => items.push({ id: i._tmp, producto: i.producto, cantidad: i.cantidad, lugar: i.lugar, nota: i.nota, quien: cfg.q, fecha: ahora, estado: 'pendiente', local: true }));
      lsSet('items', items);
      toast('Sin señal: queda guardado en el celular y se manda solo después', '', null, 3500);
    } else { avisoTemp(e.message); throw e; }
  }
  pintarLista(); pintarAvisos();
}

// ---------- Propuesta (fichas editables) ----------
function pintarPropuesta() {
  const sec = $('propuesta');
  if (!propuesta) { sec.classList.add('hide'); return; }
  sec.classList.remove('hide');
  $('entendi').textContent = propuesta.texto ? 'Entendí: “' + propuesta.texto + '”' : '';
  const f = $('fichas');
  if (!propuesta.items.length) { f.innerHTML = '<div class="vacio">No encontré productos. Probá de nuevo o escribilo a mano.</div>'; $('bGuardar').disabled = true; return; }
  $('bGuardar').disabled = false;
  f.innerHTML = propuesta.items.map((it, n) =>
    '<div class="ficha" data-n="' + n + '">' +
    '<input class="n" data-f="producto" value="' + esc(it.producto) + '" aria-label="Producto">' +
    '<input class="c" data-f="cantidad" value="' + esc(it.cantidad) + '" placeholder="Cant." aria-label="Cantidad">' +
    '<select data-f="lugar" aria-label="Lugar">' + LUGARES.map((l) => '<option' + (l === it.lugar ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
    '<button class="x" data-quitar="' + n + '" aria-label="Sacar">✕</button></div>').join('');
}
function mostrarPropuesta(texto, lista) {
  propuesta = { texto, items: lista.map((i) => ({ producto: i.producto || '', cantidad: i.cantidad || '', lugar: LUGARES.indexOf(i.lugar) >= 0 ? i.lugar : lugar, nota: i.nota || '' })) };
  pintarPropuesta();
}

// ---------- Audio: grabación ----------
let rec = null, chunks = [], tIni = 0, timer = null, stream = null, ctxA = null, analyser = null, rafId = 0, mimeRec = '';
function elegirMime() {
  const c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  if (!window.MediaRecorder) return '';
  return c.find((m) => MediaRecorder.isTypeSupported(m)) || '';
}
async function empezar() {
  if (!configurado()) { abrirAjustes(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { setEstado('Este navegador no puede grabar. Usá Chrome.'); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { setEstado('No pude usar el micrófono. Dale permiso en el navegador.'); return; }
  mimeRec = elegirMime();
  rec = new MediaRecorder(stream, mimeRec ? { mimeType: mimeRec } : undefined);
  chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = alParar;
  rec.start(1000);
  tIni = Date.now();
  $('mic').classList.add('rec');
  propuesta = null; pintarPropuesta();
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - tIni) / 1000);
    setEstado('Grabando… ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' (tocá para terminar)');
    if (s >= MAX_SEG) parar();
  }, 250);
  try {
    ctxA = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ctxA.createAnalyser(); analyser.fftSize = 256;
    ctxA.createMediaStreamSource(stream).connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    const loop = () => {
      analyser.getByteTimeDomainData(buf);
      let m = 0; for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128));
      $('nivel').style.transform = 'scale(' + (1 + Math.min(m / 128, 1) * 0.35) + ')';
      rafId = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { /* sin animación de nivel */ }
}
function parar() {
  if (!rec || rec.state === 'inactive') return;
  clearInterval(timer); cancelAnimationFrame(rafId);
  $('nivel').style.transform = 'scale(1)';
  $('mic').classList.remove('rec');
  rec.stop();
  stream.getTracks().forEach((t) => t.stop());
  if (ctxA) { try { ctxA.close(); } catch (e) { /* nada */ } ctxA = null; }
}
async function alParar() {
  const mime = (rec && rec.mimeType) || mimeRec || 'audio/webm';
  const blob = new Blob(chunks, { type: mime });
  rec = null;
  if (blob.size < 1500) { setEstado('No se escuchó nada. Probá de nuevo.'); return; }
  await transcribirBlob(blob, lugar, true);
}
// ---------- Audio: transcripción ----------
function aBase64(blob) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1]);
    fr.onerror = () => mal(fr.error);
    fr.readAsDataURL(blob);
  });
}
async function transcribirBlob(blob, lug, guardarSiFalla) {
  setEstado('Escuchando lo que dijiste…');
  $('mic').disabled = true;
  try {
    const j = await apiPost({ accion: 'transcribir', audio: await aBase64(blob), mime: blob.type || 'audio/webm', lugar: lug });
    mostrarPropuesta(j.texto, j.items || []);
    setEstado('Revisá y guardá');
    return true;
  } catch (e) {
    if (e instanceof ErrRed && guardarSiFalla) {
      try { await idbGuardar({ blob, lugar: lug, t: Date.now() }); setEstado('Sin señal: guardé el audio en el celular. Cuando vuelva la conexión tocá “Transcribir pendientes”.'); }
      catch (e2) { setEstado('Sin señal y no pude guardar el audio. Probá de nuevo cuando haya conexión.'); }
    } else if (e instanceof ErrRed) setEstado('Sigue sin señal.');
    else setEstado('No pude entender el audio: ' + e.message);
    return false;
  } finally { $('mic').disabled = false; pintarAvisos(); }
}

// ---------- Audios pendientes (IndexedDB) ----------
function idb() {
  return new Promise((ok, mal) => {
    const r = indexedDB.open('listavoz', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('audios', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => mal(r.error);
  });
}
async function idbOp(modo, fn) {
  const db = await idb();
  return new Promise((ok, mal) => {
    const tx = db.transaction('audios', modo);
    const res = fn(tx.objectStore('audios'));
    tx.oncomplete = () => ok(res && res.result);
    tx.onerror = () => mal(tx.error);
  });
}
const idbGuardar = (o) => idbOp('readwrite', (s) => s.add(o));
const idbTodos = () => idbOp('readonly', (s) => s.getAll());
const idbBorrar = (id) => idbOp('readwrite', (s) => s.delete(id));
async function transcribirPendientes() {
  const todos = (await idbTodos().catch(() => [])) || [];
  if (!todos.length) return;
  const a = todos[0];
  const ok = await transcribirBlob(a.blob, a.lugar, false);
  if (ok) await idbBorrar(a.id);
  pintarAvisos();
}

// ---------- Avisos y toast ----------
async function pintarAvisos() {
  const el = $('avisos');
  let h = '';
  if (cola.length) h += '<div class="aviso">Hay ' + cola.length + ' cambio' + (cola.length > 1 ? 's' : '') + ' sin enviar. Se mandan solos cuando haya señal.</div>';
  const aud = (await idbTodos().catch(() => [])) || [];
  if (aud.length) h += '<div class="aviso">Tenés ' + aud.length + ' audio' + (aud.length > 1 ? 's' : '') + ' sin transcribir.<br><button id="bTransPend">Transcribir pendientes</button></div>';
  el.innerHTML = h;
}
function setEstado(t) { $('estado').textContent = t; }
function avisoTemp(t) { toast(t, '', null, 4500); }
let toastT = null;
function toast(texto, boton, alBoton, ms, alCerrar) {
  clearTimeout(toastT);
  const prevCierre = toast._cierre; toast._cierre = null;
  if (prevCierre) prevCierre();
  $('toastTx').textContent = texto;
  const b = $('toastBt');
  b.textContent = boton || ''; b.classList.toggle('hide', !boton);
  b.onclick = () => { if (alBoton) alBoton(); cerrar(true); };
  $('toast').classList.add('on');
  toast._cierre = alCerrar || null;
  function cerrar(soloUI) {
    clearTimeout(toastT);
    $('toast').classList.remove('on');
    const c = toast._cierre; toast._cierre = null;
    if (c) c();
  }
  toastT = setTimeout(() => cerrar(false), ms || 3000);
}

// ---------- Eventos ----------
function pintarLugares() {
  $('lugares').innerHTML = LUGARES.map((l) => '<button class="chip' + (l === lugar ? ' on' : '') + '" data-l="' + l + '">' + l + '</button>').join('');
}
$('lugares').addEventListener('click', (e) => {
  const b = e.target.closest('[data-l]'); if (!b) return;
  lugar = b.dataset.l; lsSet('lugar', lugar); pintarLugares();
});
$('mic').addEventListener('click', () => { if (rec && rec.state === 'recording') parar(); else empezar(); });
$('bAjustes').addEventListener('click', abrirAjustes);
$('bVolver').addEventListener('click', cerrarAjustes);
$('bGuardarAj').addEventListener('click', guardarAjustes);
$('aQuien').addEventListener('change', () => $('aOtro').classList.toggle('hide', $('aQuien').value !== 'otro'));
$('bRefrescar').addEventListener('click', refrescar);
$('lista').addEventListener('click', (e) => { const b = e.target.closest('[data-del]'); if (b) borrar(b.dataset.del); });
$('avisos').addEventListener('click', (e) => { if (e.target.id === 'bTransPend') transcribirPendientes(); });
$('fichas').addEventListener('input', (e) => {
  const f = e.target.closest('.ficha'); if (!f || !e.target.dataset.f) return;
  propuesta.items[+f.dataset.n][e.target.dataset.f] = e.target.value;
});
$('fichas').addEventListener('click', (e) => {
  const b = e.target.closest('[data-quitar]'); if (!b) return;
  propuesta.items.splice(+b.dataset.quitar, 1); pintarPropuesta();
});
$('bDescartar').addEventListener('click', () => { propuesta = null; pintarPropuesta(); setEstado('Tocá el micrófono y decí lo que falta'); });
$('bGuardar').addEventListener('click', async () => {
  const lista = propuesta.items.slice();
  $('bGuardar').disabled = true;
  try { await guardarItems(lista); propuesta = null; pintarPropuesta(); setEstado('Tocá el micrófono y decí lo que falta'); }
  catch (e) { $('bGuardar').disabled = false; }
});
$('fManual').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = $('iManual').value.trim(); if (!v) return;
  $('iManual').value = '';
  try { await guardarItems([{ producto: v, cantidad: '', lugar: lugar, nota: '' }]); } catch (err) { $('iManual').value = v; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refrescar(); });
window.addEventListener('online', refrescar);

// ---------- Inicio ----------
leerHash();
pintarLugares();
pintarLista();
pintarAvisos();
if (!configurado()) abrirAjustes(); else refrescar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
