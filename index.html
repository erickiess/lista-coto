<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1A17" media="(prefers-color-scheme: dark)">
<title>Lista de compras</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#FBF7F0;--card:#FFFFFF;--card2:#F4EEE3;--tx:#2A2620;--tx2:#7A7164;--bd:#E8DFD0;
  --ac:#2F7D4F;--ac2:#E1F0E6;--acx:#FFFFFF;--tom:#E2553D;--tom2:#FBE4DF;
  --warn:#9A5B13;--warnbg:#FBEBCB;--snack:#2A2620;--snacktx:#FBF7F0;
  --sh:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.06);
  --shm:0 8px 24px rgba(226,85,61,.35),0 2px 6px rgba(226,85,61,.3);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1C1A17;--card:#27231F;--card2:#322D27;--tx:#F3ECE0;--tx2:#A59B8C;--bd:#3A342D;
  --ac:#58B67C;--ac2:#243A2D;--acx:#12251A;--tom:#EE6A52;--tom2:#4A2822;
  --warn:#F0BE6B;--warnbg:#3D2F14;--snack:#F3ECE0;--snacktx:#1C1A17;
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --shm:0 8px 24px rgba(238,106,82,.3),0 2px 6px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body{padding:0 16px calc(110px + env(safe-area-inset-bottom));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));max-width:560px;margin:0 auto;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;transition:transform .15s,background-color .2s,opacity .2s}
button:active{transform:scale(.97)}
.hide{display:none!important}
.sub{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);font-weight:600}

/* header */
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 6px;padding-top:calc(18px + env(safe-area-inset-top))}
h1{font-size:clamp(24px,7.4vw,28px);line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em}
#cuenta{margin:4px 0 0;color:var(--tx2);font-size:15px}
.ico{background:none;border:0;color:var(--tx2);min-width:44px;min-height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico:active{background:var(--card2)}
.ico svg{width:24px;height:24px}

/* banner sin señal */
.aviso{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:11px 14px;margin:8px 0;font-size:14px;display:flex;gap:10px;align-items:center;animation:ent .25s ease both}
.aviso svg{width:18px;height:18px;flex:none}
.aviso button{margin-left:auto;border:1.5px solid currentColor;background:none;border-radius:10px;padding:8px 12px;font-weight:600;min-height:44px;font-size:14px}


/* micrófono */
.mic-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.mic-box{position:relative;width:96px;height:96px;margin:14px 0 10px}
#mic{position:absolute;inset:0;width:96px;height:96px;border-radius:50%;border:0;background:var(--tom);color:#fff;box-shadow:var(--shm);display:grid;place-items:center;z-index:2}
#mic svg{width:42px;height:42px;position:relative;z-index:1}
#mic:disabled{opacity:.6}
#mic .nivel{position:absolute;inset:-6px;border-radius:50%;background:var(--tom);opacity:.0;transition:transform .08s linear;pointer-events:none;z-index:0}
#mic.rec .nivel{opacity:.28}
.aro{position:absolute;inset:0;border-radius:50%;border:2px solid var(--tom);opacity:0;pointer-events:none;z-index:1}
#mic.rec ~ .aro{animation:aro 1.8s ease-out infinite}
#mic.rec ~ .aro.b{animation-delay:.9s}
@keyframes aro{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
.mic-info{text-align:center;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tiempo{font-size:40px;font-weight:700;line-height:1.1;color:var(--tom)}
#estado{color:var(--tx2);font-size:15px;max-width:320px}

/* skeleton */
#pensando{margin:12px 0}
.sk{height:56px;border-radius:var(--r);margin:8px 0;background:linear-gradient(100deg,var(--bd) 30%,var(--card2) 50%,var(--bd) 70%);background-size:300% 100%;animation:shim 1.3s linear infinite}
.sk:nth-child(2){animation-delay:.15s;width:92%}.sk:nth-child(3){animation-delay:.3s;width:80%}
@keyframes shim{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* propuesta */
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh);animation:ent .3s ease both}
.entendi{margin:0 0 12px;color:var(--tx2);font-size:14px;line-height:1.45}
.entendi b{font-style:normal;color:var(--tx);font-weight:700}
.entendi i{font-style:italic}
.ficha{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;margin:8px 0;background:var(--card2);border-radius:16px;flex-wrap:wrap;animation:ent .32s ease both;animation-delay:calc(var(--n,0) * 60ms)}
.ficha input,.ficha select{font:inherit;color:inherit;border:0;background:transparent;min-height:44px;padding:0 6px;border-radius:10px}
.ficha input.n{flex:1 1 auto;min-width:0;order:0;font-weight:600;font-size:16px}
.ficha input.c{width:62px;flex:none;text-align:center;background:var(--ac2);color:var(--ac);font-weight:700;border-radius:999px;min-height:36px;font-size:14px}
.ficha input.c::placeholder{color:var(--tx2);font-weight:500}
.ficha select{max-width:112px;font-size:14px;color:var(--tx2);appearance:none;-webkit-appearance:none;background:var(--card);border-radius:999px;padding:0 12px;min-height:36px}
.ficha input:focus,.ficha select:focus{outline:2px solid var(--ac);outline-offset:1px}
.ficha input.c{order:1}.ficha .x{order:2}
.x{background:none;border:0;color:var(--tx2);min-width:44px;min-height:44px;border-radius:12px;font-size:16px;flex:none}
.x:active{background:var(--tom2);color:var(--tom)}
.fila{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;min-height:52px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);font-weight:600;font-size:16px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx);flex:2}
.btn:disabled{opacity:.5}
.vacio{color:var(--tx2);text-align:center;padding:20px 0}

/* manual */
.manual{display:flex;align-items:center;margin:14px 0 4px;background:var(--card);border:1.5px solid var(--bd);border-radius:999px;padding:4px 4px 4px 18px;box-shadow:var(--sh);transition:border-color .2s}
.manual:focus-within{border-color:var(--ac)}
.manual input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:inherit;min-height:44px;outline:none}
.manual input::placeholder{color:var(--tx2)}
.manual button{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:var(--acx);font-size:26px;line-height:1;display:grid;place-items:center;padding:0 0 3px;flex:none}

/* lista */
.lista-h{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.lista-h .ico{min-width:44px}
.item{position:relative;border-radius:var(--r);margin:8px 0;animation:ent .28s ease both}
.item.sw{background:var(--tom);overflow:hidden}
.item:not(.sw)::after{display:none}
.item::after{content:"🗑";position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:20px;filter:grayscale(1) brightness(3)}
.item .fg{position:relative;z-index:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:8px 4px 8px 16px;min-height:60px;box-shadow:var(--sh);touch-action:pan-y;transition:transform .2s ease}
.item .fg.arr{transition:none}
.item .t{flex:1;min-width:0}
.item .nom{font-size:16px;font-weight:600;line-height:1.25;word-break:break-word}
.item .q{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;background:var(--ac2);color:var(--ac);font-size:13px;font-weight:700;vertical-align:1px}
.item .m{display:flex;align-items:center;gap:5px;color:var(--tx2);font-size:12.5px;margin-top:2px}
.item .m svg{width:14px;height:14px;flex:none;color:var(--warn)}
.item.local .fg{background:var(--warnbg);border-color:transparent}
.item .x{opacity:.55}
.btnHist{display:block;width:100%;margin:18px 0 8px;min-height:48px;border-radius:16px;border:1.5px dashed var(--bd);background:none;color:var(--tx2);font:inherit;font-weight:600}
.btnHist:active{background:var(--card2)}
.compra{background:var(--card2);border-radius:18px;padding:4px 10px;margin:12px 0}
.compra summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:0 4px;cursor:pointer}
.compra summary::-webkit-details-marker{display:none}
.compra summary::after{content:"▾";color:var(--tx2);transition:transform .2s}
.compra[open] summary::after{transform:rotate(180deg)}
.compra .ct{flex:1;font-weight:700}
.compra .cn{color:var(--tx2);font-size:13px;flex:none}
.compra[open]{padding-bottom:8px}
.hitem{display:flex;align-items:center;gap:8px;padding:6px 4px 6px 14px;margin:6px 0;background:var(--card);border:1px solid var(--bd);border-radius:14px;min-height:52px}
.hitem .t{flex:1;min-width:0}
.hitem .nom{font-weight:600;word-break:break-word}
.hitem .q{margin-left:6px;color:var(--ac);font-size:13px;font-weight:700}
.hitem .m{color:var(--tx2);font-size:12.5px}
.hitem .re{flex:none;min-height:40px;padding:0 12px;border-radius:999px;border:0;background:var(--ac2);color:var(--ac);font:inherit;font-size:14px;font-weight:700}
.vacioG{text-align:center;padding:36px 16px 16px;color:var(--tx2)}
.vacioG .big{font-size:64px;line-height:1.1;animation:flota 3s ease-in-out infinite}
.vacioG p{margin:8px 0 0;font-size:17px;color:var(--tx);font-weight:600}
.vacioG small{display:block;margin-top:4px;font-size:14px}
@keyframes flota{50%{transform:translateY(-6px)}}
@keyframes ent{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* snackbar */
#toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;background:var(--snack);color:var(--snacktx);border-radius:18px;padding:6px 8px 6px 18px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:30;min-height:52px;box-shadow:0 10px 30px rgba(0,0,0,.28);font-size:15px}
#toast.on{display:flex;animation:snack .25s ease both}
#toast button{background:none;border:0;color:var(--ac);font-weight:700;padding:0 12px;min-height:44px;border-radius:12px;font-size:15px}
#toast button{color:#58B67C}
@media (prefers-color-scheme:dark){#toast button{color:#2F7D4F}}
@keyframes snack{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ajustes: hoja desde abajo */
.sheetwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(20,15,5,.45);animation:fade .2s ease both}
.sheet{position:relative;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:sube .28s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 8px}
.sheet .cab{display:flex;align-items:center;justify-content:space-between}
.sheet h2{margin:0;font-size:22px;font-weight:700}
.sheet label{display:block;margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);font-weight:600}
.sheet input,.sheet select{width:100%;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:0 14px;min-height:50px}
.sheet input:focus,.sheet select:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.hint{color:var(--tx2);font-size:13px;margin-top:14px}
.hint code{background:var(--card2);padding:1px 5px;border-radius:6px;word-break:break-all}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sube{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<!-- Pantalla principal -->
<main id="pPrincipal">
  <header>
    <div>
      <h1 id="saludo">Lista de compras</h1>
      <p id="cuenta"></p>
    </div>
    <button class="ico" id="bAjustes" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </header>

  <div id="avisos"></div>

  <div class="mic-wrap">
    <div class="mic-box">
      <button id="mic" aria-label="Grabar"><span class="nivel" id="nivel"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      </button>
      <span class="aro"></span><span class="aro b"></span>
    </div>
    <div class="mic-info">
      <div id="tiempo" class="hide">0:00</div>
      <div id="estado">Abrí la alacena y decí lo que falta</div>
    </div>
  </div>

  <div id="pensando" class="hide" aria-hidden="true"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>

  <section id="propuesta" class="card hide">
    <p class="entendi" id="entendi"></p>
    <div id="fichas"></div>
    <div class="fila">
      <button class="btn" id="bDescartar">Descartar</button>
      <button class="btn pri" id="bGuardar">Guardar</button>
    </div>
  </section>

  <form class="manual" id="fManual">
    <input id="iManual" placeholder="O escribilo acá…" autocomplete="off" enterkeyhint="done">
    <button type="submit" aria-label="Sumar">+</button>
  </form>

  <div class="lista-h">
    <span class="sub">Falta comprar</span>
    <button class="ico" id="bRefrescar" aria-label="Refrescar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v4.5h-4.5"/></svg>
    </button>
  </div>
  <div id="lista"><div class="vacio">Cargando…</div></div>
  <button class="btnHist" id="bHistorial">🕘 Historial de lo comprado</button>
</main>

<!-- Historial (hoja desde abajo) -->
<div id="pHistorial" class="sheetwrap hide">
  <div class="backdrop" id="bdHist"></div>
  <div class="sheet" role="dialog" aria-label="Historial">
    <div class="grip"></div>
    <div class="cab">
      <h2>Historial</h2>
      <button class="ico" id="bCerrarHist" aria-label="Cerrar">✕</button>
    </div>
    <div id="historial"><div class="vacio">Cargando…</div></div>
  </div>
</div>

<!-- Ajustes (hoja desde abajo) -->
<div id="pAjustes" class="sheetwrap hide ajustes">
  <div class="backdrop" id="bdAj"></div>
  <div class="sheet" role="dialog" aria-label="Ajustes">
    <div class="grip"></div>
    <div class="cab">
      <h2>Ajustes</h2>
      <button class="ico" id="bVolver" aria-label="Cerrar">✕</button>
    </div>
    <label for="aUrl">Dirección del Apps Script</label>
    <input id="aUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <label for="aClave">Clave</label>
    <input id="aClave" type="password" autocomplete="off">
    <label for="aQuien">¿Quién sos?</label>
    <select id="aQuien"><option>Erick</option><option>Luciana</option><option value="otro">Otro…</option></select>
    <input id="aOtro" class="hide" placeholder="Tu nombre" style="margin-top:8px">
    <div class="fila"><button class="btn pri" id="bGuardarAj">Guardar</button></div>
    <p class="hint">Para configurar otro celular: abrí la app con un link que termine en <code>#u=…&amp;k=…&amp;q=…</code>.</p>
  </div>
</div>

<div id="toast"><span id="toastTx"></span><button id="toastBt"></button></div>

<script>
'use strict';
// ---------- Constantes ----------
const LUGARES = ['Alacena', 'Heladera', 'Freezer', 'Limpieza', 'Baño', 'Otros'];
const MAX_SEG = 120;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SVG_NUBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H7a5 5 0 0 1-.9-9.9M9.5 5.6A6 6 0 0 1 17.9 10 4 4 0 0 1 21 14a4 4 0 0 1-1.2 2.8"/><path d="M3 3l18 18"/></svg>';

// ---------- Almacenamiento ----------
function lsGet(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin storage */ } }
let cfg = lsGet('cfg', { u: '', k: '', q: '' });
const lugar = '';                         // sin categorías: una sola lista (Gemini guarda el lugar por producto)
let items = lsGet('items', []);          // cache de la lista
let cola = lsGet('cola', []);            // operaciones sin enviar
let propuesta = null;                    // {texto, items:[{producto,cantidad,lugar,nota}]}
let enCurso = 0;                         // audios transcribiéndose (se puede grabar otro mientras tanto)
let ocultos = new Set();                 // ids borrados con deshacer en curso
let animarFichas = false;

// ---------- Ajustes y link de configuración ----------
function leerHash() {
  if (!location.hash || location.hash.length < 2) return;
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('u') || p.get('k') || p.get('q')) {
    if (p.get('u')) cfg.u = p.get('u');
    if (p.get('k')) cfg.k = p.get('k');
    if (p.get('q')) cfg.q = p.get('q');
    lsSet('cfg', cfg);
    history.replaceState(null, '', location.pathname + location.search);
  }
}
function abrirAjustes() {
  $('aUrl').value = cfg.u || '';
  $('aClave').value = cfg.k || '';
  const sel = $('aQuien');
  const conocido = cfg.q === 'Erick' || cfg.q === 'Luciana';
  sel.value = conocido || !cfg.q ? (cfg.q || 'Erick') : 'otro';
  $('aOtro').classList.toggle('hide', sel.value !== 'otro');
  $('aOtro').value = conocido ? '' : (cfg.q || '');
  $('pAjustes').classList.remove('hide');
}
function cerrarAjustes() {
  $('pAjustes').classList.add('hide');
}
function guardarAjustes() {
  cfg.u = $('aUrl').value.trim();
  cfg.k = $('aClave').value.trim();
  const s = $('aQuien').value;
  cfg.q = s === 'otro' ? ($('aOtro').value.trim() || 'Otro') : s;
  lsSet('cfg', cfg);
  cerrarAjustes();
  pintarLista();
  refrescar();
}
function configurado() { return !!(cfg.u && cfg.k); }

// ---------- Red ----------
class ErrRed extends Error {}
async function apiGet(accion) {
  const url = cfg.u + (cfg.u.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(cfg.k) + '&accion=' + encodeURIComponent(accion);
  let r;
  try { r = await fetch(url); } catch (e) { throw new ErrRed('Sin conexión'); }
  return await leerResp(r);
}
async function apiPost(cuerpo) {
  let r;
  try {
    r = await fetch(cfg.u, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ k: cfg.k }, cuerpo)) });
  } catch (e) { throw new ErrRed('Sin conexión'); }
  return await leerResp(r);
}
async function leerResp(r) {
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Respuesta rara del servidor'); }
  if (!j.ok) throw new Error(j.error === 'clave' ? 'La clave no coincide (revisá Ajustes)' : (j.error || 'Error'));
  return j;
}

// ---------- Cola sin conexión ----------
function guardarCola() { lsSet('cola', cola); }
async function vaciarCola() {
  if (!configurado() || !cola.length) return;
  while (cola.length) {
    const op = cola[0];
    try { await apiPost(op); } catch (e) {
      if (e instanceof ErrRed) break;
      if (/clave/.test(e.message)) break;
    }
    cola.shift(); guardarCola();
  }
  pintarAvisos();
}

// ---------- Lista ----------
async function refrescar() {
  if (!configurado()) { pintarLista(); pintarAvisos(); return; }
  await vaciarCola();
  try {
    const j = await apiGet('lista');
    items = j.items || [];
    lsSet('items', items);
  } catch (e) {
    avisoTemp(e instanceof ErrRed ? 'Sin señal: muestro la última lista guardada.' : e.message);
  }
  pintarLista();
  pintarAvisos();
}
function tiempoRel(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const min = Math.floor((Date.now() - d.getTime()) / 60000);
  if (min < 1) return 'recién';
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.floor(min / 60);
  if (h < 24) return 'hace ' + h + ' h';
  const dias = Math.floor(h / 24);
  if (dias === 1) return 'ayer';
  if (dias < 7) return 'hace ' + dias + ' días';
  return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
}
function saludo() {
  const h = new Date().getHours();
  const s = h < 6 ? 'Buenas noches' : h < 13 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
  return cfg.q ? s + ', ' + cfg.q : s;
}
function pintarCabecera(n) {
  $('saludo').textContent = saludo();
  $('cuenta').textContent = !configurado() ? 'Configurá la app en Ajustes' : n === 0 ? 'No falta nada' : n === 1 ? '1 cosa en la lista' : n + ' cosas en la lista';
}
function pintarLista() {
  const el = $('lista');
  const vis = items.filter((i) => !ocultos.has(i.id));
  pintarCabecera(vis.length);
  if (!configurado()) { el.innerHTML = '<div class="vacioG"><div class="big">⚙️</div><p>Falta configurar</p><small>Tocá el ícono de ajustes arriba a la derecha.</small></div>'; return; }
  if (!vis.length) { el.innerHTML = '<div class="vacioG"><div class="big">🧺</div><p>No falta nada. ¡Despensa llena!</p></div>'; return; }
  let h = '';
  vis.forEach((i) => {
      const quien = [i.quien, tiempoRel(i.fecha)].filter(Boolean).join(' · ');
      const meta = (i.local ? SVG_NUBE : '') + '<span>' + esc(quien) + (i.local ? ' · sin enviar' : '') + (i.nota ? ' · ' + esc(i.nota) : '') + '</span>';
      h += '<div class="item' + (i.local ? ' local' : '') + '"><div class="fg"><div class="t"><span class="nom">' + esc(i.producto) + '</span>' +
        (i.cantidad ? '<span class="q">' + (/^\d+([.,]\d+)?$/.test(String(i.cantidad).trim()) ? '× ' : '') + esc(i.cantidad) + '</span>' : '') + '<div class="m">' + meta + '</div></div>' +
        '<button class="x" data-del="' + esc(i.id) + '" aria-label="Borrar">✕</button></div></div>';
  });
  el.innerHTML = h;
}

// ---------- Historial ----------
let historial = lsGet('historial', []);
function abrirHistorial() {
  $('pHistorial').classList.remove('hide');
  pintarHistorial();
  if (configurado()) apiGet('historial').then((j) => { historial = j.items || []; lsSet('historial', historial); pintarHistorial(); })
    .catch((e) => avisoTemp(e instanceof ErrRed ? 'Sin señal: muestro el último historial guardado.' : e.message));
}
function cerrarHistorial() { $('pHistorial').classList.add('hide'); }
function pintarHistorial() {
  const el = $('historial');
  if (!historial.length) { el.innerHTML = '<div class="vacioG"><div class="big">🧾</div><p>Todavía no hay compras</p><small>Lo que se compra de la lista queda acá.</small></div>'; return; }
  // una compra = lo que se marcó como comprado junto (viene ordenado del más nuevo al más viejo)
  const compras = [];
  historial.forEach((i, n) => {
    const t = new Date(i.comprado_el).getTime() || 0;
    const ult = compras[compras.length - 1];
    if (ult && Math.abs(ult.t - t) < 3 * 3600e3) ult.items.push(n); else compras.push({ t, items: [n] });
  });
  el.innerHTML = compras.map((c, k) => {
    const d = new Date(c.t);
    const otroAnio = d.getFullYear() !== new Date().getFullYear();
    const fecha = c.t ? d.toLocaleDateString('es-AR', Object.assign({ day: 'numeric', month: 'long' }, otroAnio ? { year: 'numeric' } : {})) : 'sin fecha';
    const filas = c.items.map((n) => {
      const i = historial[n];
      return '<div class="hitem"><div class="t"><span class="nom">' + esc(i.producto) + '</span>' + (i.cantidad ? '<span class="q">' + esc(i.cantidad) + '</span>' : '') +
        '<div class="m">' + esc([i.quien, i.nota].filter(Boolean).join(' · ')) + '</div></div>' +
        '<button class="re" data-re="' + n + '">+ Anotar</button></div>';
    }).join('');
    return '<details class="compra"' + (k === 0 ? ' open' : '') + '><summary><span class="ct">Compra del ' + esc(fecha) + '</span>' +
      '<span class="cn">' + c.items.length + (c.items.length === 1 ? ' producto' : ' productos') + '</span></summary>' + filas + '</details>';
  }).join('');
}

// ---------- Deslizar para borrar ----------
let sw = null;
$('lista').addEventListener('touchstart', (e) => {
  const fg = e.target.closest('.fg');
  if (!fg || e.touches.length !== 1) return;
  sw = { fg, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, lock: null };
}, { passive: true });
$('lista').addEventListener('touchmove', (e) => {
  if (!sw) return;
  const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (!sw.lock && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) { sw.lock = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v'; sw.fg.classList.add("arr"); sw.fg.parentNode.classList.add("sw"); }
  if (sw.lock === 'h') { sw.dx = Math.max(-200, Math.min(0, dx)); sw.fg.style.transform = 'translateX(' + sw.dx + 'px)'; }
}, { passive: true });
function finSwipe() {
  if (!sw) return;
  const s = sw; sw = null;
  s.fg.classList.remove("arr");
  const b = s.fg.querySelector('[data-del]');
  if (s.lock === 'h' && s.dx < -90 && b) { s.fg.style.transform = 'translateX(-110%)'; setTimeout(() => borrar(b.dataset.del), 160); }
  else { s.fg.style.transform = ''; setTimeout(() => s.fg.parentNode && s.fg.parentNode.classList.remove('sw'), 200); }
}
$('lista').addEventListener('touchend', finSwipe);
$('lista').addEventListener('touchcancel', finSwipe);

// ---------- Borrar con deshacer ----------
function borrar(id) {
  ocultos.add(id);
  pintarLista();
  let deshecho = false;
  toast('Borrado', 'Deshacer', () => { deshecho = true; ocultos.delete(id); pintarLista(); }, 4000, async () => {
    if (deshecho) return;
    const it = items.find((x) => x.id === id);
    items = items.filter((x) => x.id !== id); lsSet('items', items);
    ocultos.delete(id);
    if (it && it.local) { cola = cola.filter((op) => !(op.accion === 'agregar' && op.items.some((x) => x._tmp === id))); guardarCola(); pintarLista(); return; }
    try { await apiPost({ accion: 'borrar', ids: [id] }); } catch (e) {
      if (e instanceof ErrRed) { cola.push({ accion: 'borrar', ids: [id] }); guardarCola(); pintarAvisos(); }
      else avisoTemp(e.message);
    }
    pintarLista();
  });
}

// ---------- Guardar ítems ----------
async function guardarItems(lista) {
  lista = lista.filter((i) => i.producto && i.producto.trim());
  if (!lista.length) return;
  if (!configurado()) { avisoTemp('Primero configurá la app en Ajustes.'); return; }
  try {
    const j = await apiPost({ accion: 'agregar', items: lista, quien: cfg.q });
    items = items.concat(j.items || []); lsSet('items', items);
    toast('Guardado: ' + lista.length + (lista.length === 1 ? ' producto' : ' productos'), '', null, 2500);
  } catch (e) {
    if (e instanceof ErrRed) {
      const ahora = new Date().toISOString();
      const conTmp = lista.map((i) => Object.assign({}, i, { _tmp: 'tmp' + Math.random().toString(36).slice(2, 9) }));
      cola.push({ accion: 'agregar', items: conTmp.map((i) => ({ producto: i.producto, cantidad: i.cantidad, lugar: i.lugar, nota: i.nota, _tmp: i._tmp })), quien: cfg.q });
      guardarCola();
      conTmp.forEach((i) => items.push({ id: i._tmp, producto: i.producto, cantidad: i.cantidad, lugar: i.lugar, nota: i.nota, quien: cfg.q, fecha: ahora, estado: 'pendiente', local: true }));
      lsSet('items', items);
      toast('Sin señal: queda guardado en el celular y se manda solo después', '', null, 3500);
    } else { avisoTemp(e.message); throw e; }
  }
  pintarLista(); pintarAvisos();
}

// ---------- Propuesta (fichas editables) ----------
function pintarPropuesta() {
  const sec = $('propuesta');
  if (!propuesta) { sec.classList.add('hide'); return; }
  sec.classList.remove('hide');
  $('entendi').innerHTML = propuesta.texto ? '<b>Entendí:</b> <i>“' + esc(propuesta.texto) + '”</i>' : '';
  const f = $('fichas');
  const n = propuesta.items.length;
  if (!n) { f.innerHTML = '<div class="vacio">No encontré productos. Probá de nuevo o escribilo acá abajo.</div>'; $('bGuardar').disabled = true; $('bGuardar').textContent = 'Guardar'; return; }
  $('bGuardar').disabled = false;
  $('bGuardar').textContent = n === 1 ? 'Guardar 1 cosa' : 'Guardar ' + n + ' cosas';
  f.innerHTML = propuesta.items.map((it, k) =>
    '<div class="ficha" data-n="' + k + '" style="' + (animarFichas ? '--n:' + k : 'animation:none') + '">' +
    '<input class="n" data-f="producto" value="' + esc(it.producto) + '" aria-label="Producto">' +
    '<input class="c" data-f="cantidad" value="' + esc(it.cantidad) + '" placeholder="Cant." aria-label="Cantidad">' +
    '<button class="x" data-quitar="' + k + '" aria-label="Sacar">✕</button></div>').join('');
  animarFichas = false;
}
function mostrarPropuesta(texto, lista) {
  const nuevos = lista.map((i) => ({ producto: i.producto || '', cantidad: i.cantidad || '', lugar: LUGARES.indexOf(i.lugar) >= 0 ? i.lugar : '', nota: i.nota || '' }));
  // Si ya había fichas de un audio anterior, se suman (varios audios seguidos = una sola lista para guardar).
  if (propuesta) propuesta = { texto: [propuesta.texto, texto].filter(Boolean).join(' / '), items: propuesta.items.concat(nuevos) };
  else propuesta = { texto, items: nuevos };
  animarFichas = true;
  pintarPropuesta();
}

// ---------- Audio: grabación ----------
let rec = null, chunks = [], tIni = 0, timer = null, stream = null, ctxA = null, analyser = null, rafId = 0, mimeRec = '';
function elegirMime() {
  const c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  if (!window.MediaRecorder) return '';
  return c.find((m) => MediaRecorder.isTypeSupported(m)) || '';
}
function textoReposo() { return 'Abrí la alacena, la heladera o el freezer y decí lo que falta'; }
async function empezar() {
  if (!configurado()) { abrirAjustes(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) { setEstado('Este navegador no puede grabar. Usá Chrome.'); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { setEstado('No pude usar el micrófono. Dale permiso en el navegador.'); return; }
  mimeRec = elegirMime();
  rec = new MediaRecorder(stream, mimeRec ? { mimeType: mimeRec } : undefined);
  chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = alParar;
  rec.start(1000);
  tIni = Date.now();
  $('mic').classList.add('rec');
  $('tiempo').textContent = '0:00'; $('tiempo').classList.remove('hide');
  setEstado('Tocá para terminar');
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - tIni) / 1000);
    $('tiempo').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s >= MAX_SEG) parar();
  }, 250);
  try {
    ctxA = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ctxA.createAnalyser(); analyser.fftSize = 256;
    ctxA.createMediaStreamSource(stream).connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    const loop = () => {
      analyser.getByteTimeDomainData(buf);
      let m = 0; for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128));
      $('nivel').style.transform = 'scale(' + (1 + Math.min(m / 128, 1) * 0.6) + ')';
      rafId = requestAnimationFrame(loop);
    };
    loop();
  } catch (e) { /* sin animación de nivel */ }
}
function parar() {
  if (!rec || rec.state === 'inactive') return;
  clearInterval(timer); cancelAnimationFrame(rafId);
  $('nivel').style.transform = 'scale(1)';
  $('mic').classList.remove('rec');
  $('tiempo').classList.add('hide');
  rec.stop();
  setEstado('Transcribiendo… ya podés grabar otro');
  stream.getTracks().forEach((t) => t.stop());
  if (ctxA) { try { ctxA.close(); } catch (e) { /* nada */ } ctxA = null; }
}
async function alParar() {
  const mime = (rec && rec.mimeType) || mimeRec || 'audio/webm';
  const blob = new Blob(chunks, { type: mime });
  rec = null;
  if (blob.size < 1500) { setEstado('No se escuchó nada. Probá de nuevo.'); return; }
  await transcribirBlob(blob, lugar, true);
}
// ---------- Audio: transcripción ----------
function aBase64(blob) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1]);
    fr.onerror = () => mal(fr.error);
    fr.readAsDataURL(blob);
  });
}
async function transcribirBlob(blob, lug, guardarSiFalla) {
  // Mientras se graba otro audio los mensajes van en un aviso, para no pisar "Tocá para terminar".
  const setEstado = (t) => { if (rec) avisoTemp(t); else $('estado').textContent = t; };
  if (!rec) setEstado(enCurso ? 'Transcribiendo… ya podés grabar otro' : 'Pensando…');
  enCurso++;
  $('pensando').classList.remove('hide');
  try {
    const j = await apiPost({ accion: 'transcribir', audio: await aBase64(blob), mime: blob.type || 'audio/webm', lugar: lug });
    mostrarPropuesta(j.texto, j.items || []);
    if (!rec) setEstado(enCurso > 1 ? 'Revisá y guardá (falta transcribir otro audio)' : 'Revisá y guardá');
    return true;
  } catch (e) {
    if (e instanceof ErrRed && guardarSiFalla) {
      try { await idbGuardar({ blob, lugar: lug, t: Date.now() }); setEstado('Sin señal: guardé el audio en el celular. Cuando vuelva la conexión tocá “Transcribir pendientes”.'); }
      catch (e2) { setEstado('Sin señal y no pude guardar el audio. Probá de nuevo cuando haya conexión.'); }
    } else if (/saturado/.test(e.message) && guardarSiFalla) {
      try { await idbGuardar({ blob, lugar: lug, t: Date.now() }); setEstado('Gemini está saturado: guardé el audio. Tocá “Transcribir pendientes” en un rato.'); }
      catch (e2) { setEstado(e.message); }
    } else if (e instanceof ErrRed) setEstado('Sigue sin señal.');
    else setEstado('No pude entender el audio: ' + e.message);
    return false;
  } finally { enCurso--; if (!enCurso) $('pensando').classList.add('hide'); pintarAvisos(); }
}

// ---------- Audios pendientes (IndexedDB) ----------
function idb() {
  return new Promise((ok, mal) => {
    const r = indexedDB.open('listavoz', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('audios', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => mal(r.error);
  });
}
async function idbOp(modo, fn) {
  const db = await idb();
  return new Promise((ok, mal) => {
    const tx = db.transaction('audios', modo);
    const res = fn(tx.objectStore('audios'));
    tx.oncomplete = () => ok(res && res.result);
    tx.onerror = () => mal(tx.error);
  });
}
const idbGuardar = (o) => idbOp('readwrite', (s) => s.add(o));
const idbTodos = () => idbOp('readonly', (s) => s.getAll());
const idbBorrar = (id) => idbOp('readwrite', (s) => s.delete(id));
async function transcribirPendientes() {
  const todos = (await idbTodos().catch(() => [])) || [];
  if (!todos.length) return;
  const a = todos[0];
  const ok = await transcribirBlob(a.blob, a.lugar, false);
  if (ok) await idbBorrar(a.id);
  pintarAvisos();
}

// ---------- Avisos y toast ----------
async function pintarAvisos() {
  const el = $('avisos');
  let h = '';
  const sinRed = navigator.onLine === false;
  if (sinRed || cola.length) h += '<div class="aviso">' + SVG_NUBE + '<span>' + (sinRed ? 'Sin señal: se guarda cuando vuelva' : 'Hay ' + cola.length + ' cambio' + (cola.length > 1 ? 's' : '') + ' sin enviar. Se mandan solos cuando haya señal.') + (sinRed && cola.length ? ' (' + cola.length + ' pendiente' + (cola.length > 1 ? 's' : '') + ')' : '') + '</span></div>';
  const aud = (await idbTodos().catch(() => [])) || [];
  if (aud.length) h += '<div class="aviso"><span>Tenés ' + aud.length + ' audio' + (aud.length > 1 ? 's' : '') + ' sin transcribir.</span><button id="bTransPend">Transcribir pendientes</button></div>';
  el.innerHTML = h;
}
function setEstado(t) { $('estado').textContent = t; }
function avisoTemp(t) { toast(t, '', null, 4500); }
let toastT = null;
function toast(texto, boton, alBoton, ms, alCerrar) {
  clearTimeout(toastT);
  const prevCierre = toast._cierre; toast._cierre = null;
  if (prevCierre) prevCierre();
  $('toastTx').textContent = texto;
  const b = $('toastBt');
  b.textContent = boton || ''; b.classList.toggle('hide', !boton);
  b.onclick = () => { if (alBoton) alBoton(); cerrar(true); };
  $('toast').classList.remove('on'); void $('toast').offsetWidth; $('toast').classList.add('on');
  toast._cierre = alCerrar || null;
  function cerrar(soloUI) {
    clearTimeout(toastT);
    $('toast').classList.remove('on');
    const c = toast._cierre; toast._cierre = null;
    if (c) c();
  }
  toastT = setTimeout(() => cerrar(false), ms || 3000);
}

// ---------- Eventos ----------
$('mic').addEventListener('click', () => { if (rec && rec.state === 'recording') parar(); else empezar(); });
$('bAjustes').addEventListener('click', abrirAjustes);
$('bVolver').addEventListener('click', cerrarAjustes);
$('bdAj').addEventListener('click', cerrarAjustes);
$('bGuardarAj').addEventListener('click', guardarAjustes);
$('aQuien').addEventListener('change', () => $('aOtro').classList.toggle('hide', $('aQuien').value !== 'otro'));
$('bRefrescar').addEventListener('click', refrescar);
$('bHistorial').addEventListener('click', abrirHistorial);
$('bCerrarHist').addEventListener('click', cerrarHistorial);
$('bdHist').addEventListener('click', cerrarHistorial);
$('historial').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-re]'); if (!b) return;
  const i = historial[+b.dataset.re];
  b.disabled = true;
  try { await guardarItems([{ producto: i.producto, cantidad: i.cantidad, lugar: i.lugar, nota: i.nota }]); b.textContent = '✓ Anotado'; }
  catch (err) { b.disabled = false; }
});
$('lista').addEventListener('click', (e) => { const b = e.target.closest('[data-del]'); if (b) borrar(b.dataset.del); });
$('avisos').addEventListener('click', (e) => { if (e.target.id === 'bTransPend') transcribirPendientes(); });
$('fichas').addEventListener('input', (e) => {
  const f = e.target.closest('.ficha'); if (!f || !e.target.dataset.f) return;
  propuesta.items[+f.dataset.n][e.target.dataset.f] = e.target.value;
});
$('fichas').addEventListener('click', (e) => {
  const b = e.target.closest('[data-quitar]'); if (!b) return;
  propuesta.items.splice(+b.dataset.quitar, 1); pintarPropuesta();
});
$('bDescartar').addEventListener('click', () => { propuesta = null; pintarPropuesta(); setEstado(textoReposo()); });
$('bGuardar').addEventListener('click', async () => {
  const lista = propuesta.items.slice();
  $('bGuardar').disabled = true;
  try { await guardarItems(lista); propuesta = null; pintarPropuesta(); setEstado(textoReposo()); }
  catch (e) { $('bGuardar').disabled = false; }
});
$('fManual').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = $('iManual').value.trim(); if (!v) return;
  $('iManual').value = '';
  try { await guardarItems([{ producto: v, cantidad: '', lugar: lugar, nota: '' }]); } catch (err) { $('iManual').value = v; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refrescar(); });
window.addEventListener('online', () => { pintarAvisos(); refrescar(); });
window.addEventListener('offline', pintarAvisos);

// ---------- Inicio ----------
leerHash();
setEstado(textoReposo());
pintarLista();
pintarAvisos();
if (!configurado()) abrirAjustes(); else refrescar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
